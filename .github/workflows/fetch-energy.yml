name: Fetch EIA energy

on:
  schedule:
    - cron: '45 15 * * 1-5'
    - cron: '45 20 * * 1-5'
    - cron: '15 22 * * 1-5'
    # Wednesday WPSR slips to Thursday after a holiday. Monday checks the late file.
    - cron: '30 16 * * 1,4'
    - cron: '30 18 * * 6'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: fetch-energy
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Fetch published WPSR and WNGSR
        id: energy
        run: python scripts/fetch_energy.py
      - name: Build signals
        if: steps.energy.outcome == 'success'
        run: python scripts/build_signals.py
      - name: Trust audit
        if: steps.energy.outcome == 'success'
        run: python -m pytest -q tests
      - name: Commit
        if: steps.energy.outcome == 'success' && success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -f data/energy.json ]; then
            git add data/energy.json data/signals.json
            if ! git diff --staged --quiet; then
              git commit -m "Update EIA energy $(date -u +%Y-%m-%dT%H:%MZ)"
              for attempt in 1 2 3; do
                if git pull --rebase -X theirs origin main && git push; then
                  exit 0
                fi
                git rebase --abort 2>/dev/null || true
                sleep 5
              done
              echo "Could not push" >&2
              exit 1
            fi
          fi
      - name: Fail the run when the fetch failed
        if: steps.energy.outcome == 'failure'
        run: |
          echo "::error::EIA fetch failed. The previous energy file was kept."
          exit 1
