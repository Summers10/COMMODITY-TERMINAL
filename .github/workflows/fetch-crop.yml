name: Fetch crop progress

on:
  schedule:
    - cron: '17 13 * * *'
    - cron: '17 22 * * *'
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - '.github/workflows/fetch-crop.yml'
      - 'scripts/crop/**'

permissions:
  contents: write

concurrency:
  group: fetch-crop
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Parser tests
        working-directory: scripts/crop
        run: python -m pytest -q test_parsers.py
      - name: Fetch
        id: crop
        continue-on-error: true
        env:
          NASS_API_KEY: ${{ secrets.NASS_API_KEY }}
        run: python scripts/crop/run_all.py
      - name: Build signals
        if: always()
        run: python scripts/build_signals.py
      - name: Trust audit
        id: trust
        if: always()
        run: python -m pytest -q tests
      - name: Commit
        if: steps.trust.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --staged --quiet; then
            echo "No data changes"
          else
            git commit -m "Update crop progress $(date -u +%Y-%m-%dT%H:%MZ)"
            for attempt in 1 2 3; do
              if git pull --rebase -X theirs origin main && git push; then
                exit 0
              fi
              git rebase --abort 2>/dev/null || true
              sleep 5
            done
            echo "Could not push" >&2
            exit 1
          fi
      - name: Fail the run when a source failed
        if: steps.crop.outcome == 'failure'
        run: |
          echo "::error::One or more crop-progress sources failed. That source's previous file was kept."
          exit 1
