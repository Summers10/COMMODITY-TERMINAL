name: Fetch cattle

on:
  schedule:
    - cron: '20 21 * * 1-5'
    - cron: '20 16 * * 5'
    - cron: '20 18 * * 6'
    - cron: '30 16 * * 1,2'
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - '.github/workflows/fetch-cattle.yml'
      - 'scripts/fetch_cattle.py'
      - 'scripts/wasde_tables.py'

permissions:
  contents: write

concurrency:
  group: fetch-cattle
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - id: cattle
        run: python scripts/fetch_cattle.py
      - name: Build signals
        if: steps.cattle.outcome == 'success'
        run: python scripts/build_signals.py
      - name: Trust audit
        if: steps.cattle.outcome == 'success'
        run: python -m pytest -q tests
      - name: Commit
        if: steps.cattle.outcome == 'success' && success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -f data/cattle.json ]; then
            git add data/cattle.json data/signals.json
            if ! git diff --staged --quiet; then
              git commit -m "Update cattle $(date -u +%Y-%m-%dT%H:%MZ)"
              for attempt in 1 2 3; do
                if git pull --rebase -X theirs origin main && git push; then
                  exit 0
                fi
                git rebase --abort 2>/dev/null || true
                sleep 5
              done
              echo "Could not push" >&2
              exit 1
            fi
          fi
      - name: Fail the run when the fetch failed
        if: steps.cattle.outcome == 'failure'
        run: |
          echo "::error::Cattle fetch failed. Sections that failed kept their previous values."
          exit 1
