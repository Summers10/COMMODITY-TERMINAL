name: Fetch CGC canola

on:
  schedule:
    - cron: '30 22 * * 4'
    - cron: '30 14 * * 5'
    - cron: '30 16 * * 6'
    - cron: '30 15 * * 1'
    # AAFC's monthly outlook usually lands in the second half of the month.
    - cron: '30 16 20 * *'
    - cron: '30 16 27 * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: fetch-cgc
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Fetch Grain Statistics Weekly
        id: weekly
        continue-on-error: true
        run: python scripts/fetch_cgc.py
      - name: Fetch StatsCan and AAFC canola balance
        id: sd
        continue-on-error: true
        run: python scripts/fetch_sd.py
      - name: Build signals
        run: python scripts/build_signals.py
      - name: Trust audit
        run: python -m pytest -q tests
      - name: Commit
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/cgc.json data/sd.json data/aafc data/signals.json || true
          if git diff --staged --quiet; then
            echo "No changes"
          else
            git commit -m "Update CGC canola $(date -u +%Y-%m-%d)"
            for attempt in 1 2 3; do
              if git pull --rebase -X theirs origin main && git push; then
                exit 0
              fi
              git rebase --abort 2>/dev/null || true
              sleep 5
            done
            echo "Could not push" >&2
            exit 1
          fi
      - name: Fail if a fetch failed
        if: steps.weekly.outcome == 'failure' || steps.sd.outcome == 'failure'
        run: |
          echo "::error::CGC fetch failed (weekly=${{ steps.weekly.outcome }}, balance=${{ steps.sd.outcome }}). The last good file was kept."
          exit 1
